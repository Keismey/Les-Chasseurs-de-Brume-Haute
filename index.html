.sp2::before{content:'';position:absolute;inset:-40px;background:#2a3138 url('img/ui/splash.webp') center/cover no-repeat;filter:blur(28px) brightness(.4)}

.sp2.on .spbg::before{transform:scale(1)}
.sp2::after{content:'';position:absolute;inset:0;width:min(100%,62vh);margin:0 auto;background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent 38%,transparent 70%,rgba(0,0,0,.55))}

.sp2.on .sptitle{opacity:1;transform:none}
.sptitle .emblem{width:min(30vw,128px);height:auto;filter:drop-shadow(0 3px 10px rgba(0,0,0,.6))}
.sptitle .title{margin:0;font-size:clamp(40px,12vw,64px);text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 22px rgba(0,0,0,.65)}.sptitle .title small{font-size:.42em}
.sptap{position:absolute;bottom:max(6vh,28px);left:0;right:0;z-index:1;text-align:center;margin:0;color:#fbf3dd;font-size:14px;letter-spacing:.06em;text-shadow:0 1px 6px rgba(0,0,0,.8);opacity:.85;animation:sptap 1.8s ease-in-out infinite}
